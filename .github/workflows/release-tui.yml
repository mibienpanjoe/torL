name: Release TUI binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux
            arch: x64
          - goos: linux
            goarch: arm64
            platform: linux
            arch: arm64
          - goos: darwin
            goarch: amd64
            platform: darwin
            arch: x64
          - goos: darwin
            goarch: arm64
            platform: darwin
            arch: arm64
          - goos: windows
            goarch: amd64
            platform: windows
            arch: x64
          - goos: windows
            goarch: arm64
            platform: windows
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Build binary
        working-directory: ./tui
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          output="torl-tui-${{ github.event.release.tag_name }}-${{ matrix.platform }}-${{ matrix.arch }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            output="${output}.exe"
          fi
          go build -ldflags="-s -w" -o "${output}" .
          ls -la "${output}"

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./tui
        run: |
          asset="torl-tui-${{ github.event.release.tag_name }}-${{ matrix.platform }}-${{ matrix.arch }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            asset="${asset}.exe"
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${asset}" --clobber
