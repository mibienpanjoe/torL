<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#161625"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7D56F4"/>
      <stop offset="55%" stop-color="#7D56F4"/>
      <stop offset="100%" stop-color="#04B575"/>
    </linearGradient>
    <linearGradient id="magnet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#04B575"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- rounded background -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- outer progress ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"/>
  <!-- progress fill arcs -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#7D56F4" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="230 260" stroke-dashoffset="50" opacity="0.95"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#04B575" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="150 260" stroke-dashoffset="320" opacity="0.95"/>

  <!-- horseshoe magnet -->
  <path d="M 184 144
           L 184 292
           A 72 72 0 0 0 328 292
           L 328 144"
        fill="none"
        stroke="url(#magnet)"
        stroke-width="52"
        stroke-linecap="round"/>

  <!-- inner magnet cutout to emphasize U shape -->
  <path d="M 184 144
           L 184 292
           A 72 72 0 0 0 328 292
           L 328 144"
        fill="none"
        stroke="#161625"
        stroke-width="22"
        stroke-linecap="round"/>

  <!-- download arrow in the gap -->
  <g transform="translate(256, 256)">
    <rect x="-7" y="-36" width="14" height="42" rx="4" fill="#ffffff"/>
    <polygon points="0,18 -16,-4 16,-4" fill="#ffffff"/>
  </g>
</svg>
