<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">torL logo</title>
  <desc id="description">A terminal prompt receiving three data pieces, forming a stylized t.</desc>

  <!-- Terminal tile -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="#161625"/>

  <!-- Peer data pieces -->
  <rect x="72" y="247" width="18" height="18" rx="5" fill="#18C58F" opacity="0.55"/>
  <rect x="105" y="243" width="26" height="26" rx="7" fill="#18C58F" opacity="0.78"/>
  <rect x="148" y="239" width="34" height="34" rx="9" fill="#18C58F"/>

  <!-- Terminal prompt -->
  <path d="M213 166 306 256 213 346"
        fill="none"
        stroke="#FAFAF7"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- The prompt flows into a lowercase t -->
  <path d="M299 220h101M350 177v151c0 24 15 38 39 38h13"
        fill="none"
        stroke="#FAFAF7"
        stroke-width="46"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
